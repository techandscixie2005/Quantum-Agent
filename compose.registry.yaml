# Official ECR images bypass daemon-wide Docker Hub registry mirrors.
# Usage: docker compose -f compose.yaml -f compose.registry.yaml up --build -d
x-api-registry-build: &api-registry-build
  args:
    PYTHON_IMAGE: public.ecr.aws/docker/library/python:3.12.13-slim-bookworm

services:
  api:
    build: *api-registry-build
  migrate:
    build: *api-registry-build
  ingest:
    build: *api-registry-build
  graph-sync-once:
    build: *api-registry-build
  graph-sync-worker:
    build: *api-registry-build
  api-test:
    build: *api-registry-build
  api-lint:
    build: *api-registry-build
  api-live-test:
    build: *api-registry-build
  api-live-model-test:
    build: *api-registry-build
  web:
    build:
      args:
        NODE_IMAGE: public.ecr.aws/docker/library/node:22.23.2-bookworm-slim
  postgres:
    image: quantum-agent-postgres:15.19-vector0.8.6
    build:
      context: ./services/postgres
  neo4j:
    image: public.ecr.aws/docker/library/neo4j:5.26.29-community
  redis:
    image: public.ecr.aws/docker/library/redis:7.4.10-alpine3.21
