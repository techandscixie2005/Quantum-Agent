[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "quantum-agent-api"
version = "0.1.0"
description = "Evidence-grounded backend for the Quantum Agent course knowledge model"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "aiosqlite>=0.21,<1",
  "argon2-cffi>=25,<26",
  "asyncpg>=0.30,<1",
  "cryptography>=45,<60",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "httpx2>=2.12,<3",
  "jieba>=0.42,<1",
  "langgraph>=0.4,<1",
  "langgraph-checkpoint-postgres>=2.0,<3",
  "matplotlib>=3.10,<4",
  "neo4j>=5.26,<7",
  "neo4j-graphrag>=1.9,<2",
  "numpy>=2.2,<3",
  "openpyxl>=3.1,<4",
  "pgvector>=0.4,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-ai>=2,<3",
  "pydantic-settings>=2.10,<3",
  "pymupdf>=1.26,<2",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "python-pptx>=1.0,<2",
  "qutip>=5.2,<6",
  "redis>=6,<8",
  "scipy>=1.15,<2",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "sympy>=1.14,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
quantum-agent = "quantum_agent.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["quantum_agent"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live_infra: requires the real Compose PostgreSQL, pgvector, Neo4j, Redis, and API services",
  "live_model: spends real USTC model calls against the running Compose API",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"quantum_agent/teaching/state_machine.py" = ["RUF001", "RUF002", "RUF003"]
"quantum_agent/teaching/agents.py" = ["RUF001", "RUF002", "RUF003"]
"quantum_agent/teaching/models.py" = ["RUF001", "RUF002", "RUF003"]
"quantum_agent/teaching/learning_native.py" = ["RUF001", "RUF002", "RUF003"]
"quantum_agent/tutor/nodes.py" = ["RUF001", "RUF002", "RUF003"]
"quantum_agent/cli.py" = ["RUF001", "RUF002", "RUF003"]
"quantum_agent/api/auth.py" = ["RUF001", "RUF002", "RUF003"]
"quantum_agent/api/teaching.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_teaching_api.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_teaching_state_machine.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_tutor_graph.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_tutor_coding_node.py" = ["RUF001", "RUF002", "RUF003", "E501"]
"tests/test_coding_agent.py" = ["RUF001", "RUF002", "RUF003", "E501"]
"tests/test_coding_sandbox.py" = ["RUF001", "RUF002", "RUF003", "E501"]
"tests/test_auth_login.py" = ["RUF001", "RUF002", "RUF003", "E501"]
"tests/test_learning_native.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_golden_loop_phase_sequence.py" = ["RUF001", "RUF002", "RUF003"]
"tests/live/test_live_multimodal_workflow.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
