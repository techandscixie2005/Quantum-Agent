name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.10.4
      - working-directory: services/api
        run: uv sync --frozen --extra dev
      - working-directory: services/api
        run: uv run --frozen --extra dev pytest -q
      - working-directory: services/api
        run: uv run --frozen --extra dev ruff check quantum_agent tests alembic
      - working-directory: services/api
        run: uv run --frozen --extra dev mypy quantum_agent tests

  live-infrastructure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_PASSWORD_URLENCODED: ci-postgres-password
      NEO4J_PASSWORD: ci-neo4j-password
      REDIS_PASSWORD: ci-redis-password
      USTC_API: ci-placeholder-not-used-by-infra-test
      QA_LIVE_REQUIRE_CORPUS: "0"
    steps:
      - uses: actions/checkout@v5
      - name: Start the real service topology
        run: docker compose up --build --detach postgres neo4j redis migrate api
      - name: Verify PostgreSQL, pgvector, checkpoints, Neo4j, Redis, and API
        run: make test-live-infra
      - name: Show bounded diagnostics on failure
        if: failure()
        run: docker compose logs --tail=120 migrate api postgres neo4j redis
      - name: Stop services
        if: always()
        run: docker compose --profile tools down --volumes --remove-orphans

  sandbox-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Run isolated sandbox adversarial tests
        run: make test-sandbox-attacks

  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint . --ignore-pattern dist --ignore-pattern .next
      - run: npm run test:unit
      - run: npx vinext build
      - run: bash scripts/validate-artifact.sh
      - run: node --test tests/rendered-html.test.mjs
      - name: Verify no secrets in client bundle
        run: bash scripts/check-secrets.sh dist

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Check for committed secrets
        run: |
          PATTERNS='sk-proj-|sk-ant-|USTC_API(_KEY)?=[A-Za-z0-9]|TEACHER_PASSWORD=[^[:space:]]|SESSION_SECRET=[^[:space:]]|ghp_|gho_'
          if git log --all -p | grep -qE "$PATTERNS"; then
            echo "Potential secrets found in git history"
            exit 1
          fi
          echo "Secret scan complete"
